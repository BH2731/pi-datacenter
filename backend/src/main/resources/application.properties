spring.application.name=datacenter-api
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/datacenter_ia}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
server.port=${PORT:8080}

app.jwt.secret=${JWT_SECRET:troque-esta-chave-antes-de-usar-em-producao-1234567890}
app.jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:28800}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:4173}
app.admin.name=${ADMIN_NAME:}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
